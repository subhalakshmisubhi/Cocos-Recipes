<!DOCTYPE html>
<html>
<head>
    <title>Login - Coco's Recipes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 80px; background: #f9f9f9; display: flex; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0275d8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .error { color: #d9534f; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Coco's Recipes Login</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <label><strong>Username:</strong></label>
            <input type="text" name="username" placeholder="Enter username" required>
            
            <label><strong>Password:</strong></label>
            <input type="password" name="password" placeholder="Enter password" required>
            
            <button type="submit">Login</button>
        </form>
        <p style="font-size: 12px; color: #666; margin-top: 15px;">Default login: <b>admin</b> / <b>coco123</b></p>
    </div>
</body>
</html>
